<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل — المرصد</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cairo', system-ui, -apple-system, Segoe UI, Tahoma, sans-serif;
        background: #ececec;
        color: #1a1a1a;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e2d4d4;
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: 0 8px 24px rgba(139, 30, 30, 0.08);
      }
      .icon { font-size: 56px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; color: #8B1E1E; }
      p { color: #64748b; font-size: 14px; line-height: 1.7; margin: 0 0 24px; }
      button {
        background: #8B1E1E;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover { background: #6d1818; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        يبدو أنك غير متصل بالشبكة حالياً. تحقق من اتصالك وحاول مرة أخرى.
        يمكنك الاطلاع على البيانات المحفوظة مسبقاً عند عودة الاتصال.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
