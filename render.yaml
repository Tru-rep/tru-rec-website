# Render Blueprint — Starbus (monorepo: app lives in starbus/server).
# https://render.com/docs/blueprint-spec
#
# Presentation deploy: demo mode (no MySQL). Three Omdurman routes seeded in memory.
# For production MySQL: set startCommand to npm start, STARBUS_DEMO=0, and DB_* vars.

services:
  - type: web
    name: starbus
    runtime: node
    rootDir: starbus/server
    plan: free
    buildCommand: npm ci
    startCommand: npm run demo
    healthCheckPath: /api/health
    envVars:
      - key: STARBUS_DEMO
        value: "1"
      - key: NODE_VERSION
        value: "20.18.1"
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
